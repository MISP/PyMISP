name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v7
      with:
        python-version: ${{matrix.python-version}}

    - name: Install python 3.13+ specific dependencies
      if: ${{ matrix.python-version == '3.13' || matrix.python-version == '3.14' || matrix.python-version == '3.15'}}
      run: |
        sudo apt-get install -y build-essential python3-dev libfuzzy-dev

    - name: Install poetry
      run: pipx install poetry

    - name: Install Python dependencies
      run: |
        poetry install -E fileobjects -E virustotal -E docs -E pdfexport -E url -E email -E brotli -E neo4j -vvv --with dev

    - name: Test with nosetests
      run: |
        poetry run install pytest mypy
        poetry run whereis pytest
        poetry run pytest tests/test_*.py
        poetry run mypy .

    - name: Test with nosetests with orjson
      run: |
        poetry run python -m pip install orjson
        poetry run python -m pytest tests/test_*.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
