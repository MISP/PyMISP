[project]
name = "pymisp"
version = "2.5.34.4"
description = "Python API for MISP."
authors = [
    {name="Raphaël Vinot", email="raphael.vinot@circl.lu"}
]
license = "BSD-2-Clause"
readme = "README.md"
requires-python = ">=3.11,<3.16"

dynamic = [ "classifiers" ]

dependencies = [
    "requests (>=2.34.2)",
    "python-dateutil (>=3.0.0)",
    "deprecated (<3) ; python_version < \"3.12\"",
    "deprecated (>=3) ; python_version >= \"3.12,<3.15\""
]

[project.urls]
repository = "https://github.com/MISP/PyMISP"
issues = "https://github.com/MISP/PyMISP/issues"
documentation = "https://pymisp.readthedocs.io"

[project.optional-dependencies]

fileobjects = [
    "pure-magic-rs (>=0.5.1)",
    "pydeep2 (>=0.5.1)",
    "lief (>=1.0.0)"
]

virustotal = [
    "validators (>=0.36.0) ; python_version == \"3.11\"",
    "validators (>=0.36.0) ; python_version >= \"3.11,<3.15\""
]

docs = [
    "sphinx-autodoc-typehints (>=3.17.4) ; python_version >= \"3.13\"",
    "sphinx (>=9.2.0) ; python_version >= \"3.13\"",
    "docutils (<0.23) ; python_version >= \"3.13\"",
    "myst-parser (>=5.1.0) ; python_version >= \"3.13\""
]

pdfexport = [ "reportlab (>=5.1.0)" ]

url = [ "pyfaup-rs (>=0.4,<0.5)" ]

email = [
    "extract_msg (>=0.57.0)",
    "RTFDE (>=0.1.2.2) ; python_version <= \"3.10\"",
    "oletools (>=0.60.2)"
]

brotli = [ "urllib3[broti] (>=2.8.0)" ]

neo4j = [ "neo4j (>=6.4.1)" ]

[tool.poetry]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Operating System :: POSIX :: Linux',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Telecommunications Industry',
    'Intended Audience :: Information Technology',
    'Topic :: Security',
    'Topic :: Internet'
]

exclude = ["pymisp/data"]
include = [
    {path = "CHANGELOG.txt", format = ["sdist"]},
    {path = "LICENSE", format = ["sdist"]},
    {path = "pymisp/data/*.json", format = ["sdist", "wheel"]},
    {path = "pymisp/data/misp-objects/*.json", format = ["sdist", "wheel"]},
    {path = "pymisp/data/misp-objects/objects/*/definition.json", format = ["sdist", "wheel"]},
    {path = "pymisp/data/misp-objects/relationships/definition.json", format = ["sdist", "wheel"]},
    {path = "docs", format = ["sdist"]},
    {path = "examples/*.py", format = ["sdist"]},
    {path = "tests", format = ["sdist"]}
]

[tool.poetry.group.dev.dependencies]
requests-mock = "^1.12.1"
mypy = "^2.4.0"
types-requests = "^2.33.0.20261006"
types-python-dateutil = "^2.9.0.20261021"
types-redis = "^4.6.0.20241004"
types-Flask = "^1.1.6"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
